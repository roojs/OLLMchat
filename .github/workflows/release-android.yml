name: Release - Android

# Manual APK build. Tags still go through Release (release.yml).

on:
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Rebuild SDK and Pixiewood/GTK caches from scratch
        type: boolean
        default: false

run-name: Release - Android - ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build-apk:
    uses: ./.github/workflows/x-android.yml
    with:
      refresh_cache: ${{ inputs.refresh_cache }}
      upload_to_release: false
