name: X - Publish Valadoc to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # Only trigger on changes to source files that affect documentation
      - 'libocsqlite/**/*.vala'
      - 'libocfiles/**/*.vala'
      - 'libocrpc/**/*.vala'
      - 'libochf/**/*.vala'
      - 'libocmarkdown/**/*.vala'
      - 'libocmarkdowngtk/**/*.vala'
      - 'libollmchat/**/*.vala'
      - 'liboctools/**/*.vala'
      - 'libocwebkit/**/*.vala'
      - 'liboccoder/**/*.vala'
      - 'libocvector/**/*.vala'
      - 'libollmchatgtk/**/*.vala'
      - 'ollmapp/**/*.vala'
      - 'examples/**/*.vala'
      - 'docs/meson.build'
      - 'docs/valadoc-wiki/**'
      - 'docs/run-valadoc.sh'
      - 'docs/fix-valadoc-index-links.sh'
      - '.github/workflows/deploy-docs.yml'
      # Copied into the site below. A version tag commits release.pins with
      # the release token, which does not start this push trigger. That
      # workflow dispatches this file on main instead.
      - 'release.pins'
      - 'snapshot.pins'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  valadoc:
    name: Generate Valadoc
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:25.04
    env:
      DEBIAN_FRONTEND: noninteractive
      ROOJS_APT_SUITE: plucky
      TZ: UTC
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Checkout repository
        uses: actions/checkout@v6

      # CI helper (not the user install path — see https://roojs.github.io/repos/).
      # webkitgtk-6.0-webdriver is required at meson setup (config/meson.build).
      - name: Enable roojs APT and install build dependencies
        run: |
          set -euo pipefail
          chmod +x scripts/ci/enable-roojs-apt.sh
          ./scripts/ci/enable-roojs-apt.sh
          apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            valac \
            valadoc \
            libgee-0.8-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libadwaita-1-dev \
            libsecret-1-dev \
            libwebkitgtk-6.0-dev \
            libwebkitgtk-6.0-webdriver-dev \
            libatspi2.0-dev \
            libsoup-3.0-dev \
            libgnutls28-dev \
            libjson-glib-dev \
            libxml2-dev \
            libsqlite3-dev \
            libgit2-glib-1.0-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            libavahi-gobject-dev \
            libomp-dev \
            libblas-dev \
            liblapack-dev \
            libseccomp-dev \
            libtree-sitter-dev \
            libfaiss-dev \
            desktop-file-utils \
            build-essential \
            pkg-config

      - name: Setup meson build
        run: |
          # Docs-only configure: skip tests (RPC suite needs runtime fixtures).
          meson setup build --prefix=/usr -Dtests=false

      - name: Build documentation
        run: |
          # Build only the valadoc documentation target (no libraries or GIR files needed)
          ninja -C build docs/valadoc

      - name: Create .nojekyll file
        run: |
          touch build/valadoc/.nojekyll

      - name: Keep pin lists on the documentation site
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import pathlib
          import urllib.request

          root = pathlib.Path("build/valadoc")
          for name in ("release.pins", "snapshot.pins"):
              src = pathlib.Path(name)
              if not src.is_file():
                  continue
              git = json.loads(src.read_text())
              dest = root / name
              dest.write_text(src.read_text())
              if git.get("packages"):
                  continue
              try:
                  with urllib.request.urlopen(
                      f"https://roojs.github.io/OLLMchat/{name}", timeout=30
                  ) as response:
                      live = json.load(response)
              except Exception:
                  continue
              packages = live.get("packages")
              if isinstance(packages, list) and packages:
                  dest.write_text(json.dumps(live, indent=2) + "\n")
          PY

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/valadoc

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: valadoc
    runs-on: ubuntu-latest
    concurrency:
      group: ollmchat-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
