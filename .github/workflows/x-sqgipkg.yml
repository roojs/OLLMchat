name: X - AppImage build (Release calls this)

# The real sqgipkg Linux AppImage job. Start Release - AppImage, not this file.
# Windows is a separate native MSYS2 job (.github/workflows/windows-build.yml).

on:
  workflow_call:
    inputs:
      refresh_cache:
        description: Rebuild sqgipkg and Meson caches from scratch
        type: boolean
        default: false

env:
  APPIMAGE_EXTRACT_AND_RUN: '1'
  DEBIAN_FRONTEND: noninteractive
  ROOJS_APT_SUITE: plucky
  TZ: UTC

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 has no roojs suite. The sysroot needs plucky plus
    # libwebkitgtk-6.0-webdriver-dev or meson rejects WebKit.
    container:
      image: ubuntu:25.04
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl sudo

      - name: Checkout OLLMchat
        uses: actions/checkout@v4
        with:
          path: OLLMchat

      - name: Restore sqgipkg dependency cache
        uses: actions/cache@v6
        with:
          path: OLLMchat/.sqgipkg
          key: sqgipkg-deps-v2-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('OLLMchat/sqgipkg.json', 'OLLMchat/scripts/release/sqgi.revision') }}
          restore-keys: |
            sqgipkg-deps-v2-stable-

      - name: Restore sqgipkg Meson build cache
        uses: actions/cache@v6
        with:
          path: |
            OLLMchat/build-linux-x86_64
            OLLMchat/build-linux-aarch64
          key: sqgipkg-meson-v3-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('OLLMchat/**/*.vala', 'OLLMchat/**/meson.build', 'OLLMchat/meson.build', 'OLLMchat/meson_options.txt', 'OLLMchat/sqgipkg.json') }}
          restore-keys: |
            sqgipkg-meson-v3-stable-

      - name: Install host build dependencies
        working-directory: OLLMchat
        run: |
          chmod +x scripts/ci/enable-roojs-apt.sh
          ./scripts/ci/enable-roojs-apt.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git file ca-certificates wget curl \
            meson valac gobject-introspection lsb-release \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev \
            libgee-0.8-dev libjson-glib-dev libsoup-3.0-dev libgnutls28-dev libxml2-dev \
            libsqlite3-dev libgtk-4-dev libgtksourceview-5-dev libadwaita-1-dev libsecret-1-dev \
            libwebkitgtk-6.0-dev libwebkitgtk-6.0-webdriver-dev libatspi2.0-dev \
            libtree-sitter-dev libseccomp-dev libgit2-glib-1.0-dev \
            libopenblas-dev liblapack-dev

      - name: Read sqgi revision
        id: sqgi
        working-directory: OLLMchat
        run: |
          rev="$(grep -v '^[[:space:]]*#' scripts/release/sqgi.revision | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')"
          if [ -z "$rev" ]; then
            echo "Missing sqgi revision in scripts/release/sqgi.revision" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Checkout sqgi (runtime + sqgipkg)
        uses: actions/checkout@v4
        with:
          repository: supercamel/sqgi
          path: sqgi
          ref: ${{ steps.sqgi.outputs.rev }}

      - name: Restore sqgi build cache
        uses: actions/cache@v6
        with:
          path: sqgi/build
          key: sqgi-build-v1-${{ hashFiles('OLLMchat/scripts/release/sqgi.revision') }}
          restore-keys: |
            sqgi-build-v1-

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static binfmt-support \
            squashfs-tools

      - name: Build and install sqgi
        run: |
          cmake -S sqgi -B sqgi/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=ON
          cmake --build sqgi/build
          sudo cmake --install sqgi/build --prefix /usr/local
          sudo ldconfig

      - name: Build Linux x86_64 AppImage
        working-directory: OLLMchat
        run: sqgipkg --target appimage --appimage-arch x86_64 --sqgi-source-dir "$GITHUB_WORKSPACE/sqgi"

      - name: Build Linux aarch64 AppImage
        working-directory: OLLMchat
        run: sqgipkg --target appimage --appimage-arch aarch64 --sqgi-source-dir "$GITHUB_WORKSPACE/sqgi"

      - name: Collect artifacts
        working-directory: OLLMchat
        run: |
          mkdir -p artifacts
          cp dist-linux-x86_64/OLLMchat.AppImage artifacts/OLLMchat-remote-only-x86_64.AppImage
          cp dist-linux-aarch64/OLLMchat.AppImage artifacts/OLLMchat-remote-only-aarch64.AppImage
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollmchat-appimage
          path: OLLMchat/artifacts/*
