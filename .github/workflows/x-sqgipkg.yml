name: X - AppImage build (Release calls this)

# The real sqgipkg Linux AppImage job. Start Release - AppImage, not this file.
# Windows is a separate native MSYS2 job (.github/workflows/windows-build.yml).

on:
  workflow_call:
    inputs:
      refresh_cache:
        description: Rebuild sqgipkg and Meson caches from scratch
        type: boolean
        default: false

env:
  APPIMAGE_EXTRACT_AND_RUN: '1'
  DEBIAN_FRONTEND: noninteractive
  ROOJS_APT_SUITE: plucky
  TZ: UTC

jobs:
  appimage:
    name: AppImage ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    # Two runners. A shared job would add the two builds together; the release
    # clock is whichever one is still running. Cache keys include the arch so
    # the two saves do not reserve the same key.
    # Ubuntu 24.04 has no roojs suite. x86_64 sysroot needs plucky plus
    # libwebkitgtk-6.0-webdriver-dev. aarch64 has no arm64 webdriver package.
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: ubuntu:25.04
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl sudo

      - name: Checkout OLLMchat
        uses: actions/checkout@v4
        with:
          path: OLLMchat

      - name: Restore sqgipkg dependency cache
        uses: actions/cache@v6
        with:
          path: OLLMchat/.sqgipkg
          key: sqgipkg-deps-${{ matrix.arch }}-v2-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('OLLMchat/sqgipkg.json', 'OLLMchat/scripts/release/sqgi.revision') }}
          restore-keys: |
            ${{ inputs.refresh_cache && 'sqgipkg-deps-nocache-' || format('sqgipkg-deps-{0}-v2-stable-', matrix.arch) }}

      # Do not hash OLLMchat/** . The sysroot cache lives under OLLMchat/.ci-cache
      # and is full of symlinks. hashFiles walks that on the post step and
      # fails the job after a successful AppImage.
      - name: Restore sqgipkg Meson build cache
        uses: actions/cache@v6
        with:
          path: OLLMchat/build-linux-${{ matrix.arch }}
          key: sqgipkg-meson-${{ matrix.arch }}-v3-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('OLLMchat/lib*/**/*.vala', 'OLLMchat/lib*/**/meson.build', 'OLLMchat/ollmapp/**/*.vala', 'OLLMchat/ollmapp/**/meson.build', 'OLLMchat/ollmfilesd/**/*.vala', 'OLLMchat/ollmfilesd/**/meson.build', 'OLLMchat/examples/**/*.vala', 'OLLMchat/examples/**/meson.build', 'OLLMchat/tests/**/*.vala', 'OLLMchat/tests/**/meson.build', 'OLLMchat/android/**/*.vala', 'OLLMchat/android/**/meson.build', 'OLLMchat/vapi/**', 'OLLMchat/meson.build', 'OLLMchat/meson_options.txt', 'OLLMchat/sqgipkg.json') }}
          restore-keys: |
            ${{ inputs.refresh_cache && 'sqgipkg-meson-nocache-' || format('sqgipkg-meson-{0}-v3-stable-', matrix.arch) }}

      # One sysroot cache per arch. The x86_64 job also accepts the v1 cache
      # from the single-arch run. aarch64 must not restore that: it is amd64.
      - name: Restore sqgipkg Linux sysroot cache
        id: sqgipkg-sysroot
        uses: actions/cache/restore@v6
        with:
          path: OLLMchat/.ci-cache/sqgipkg
          key: sqgipkg-linux-${{ matrix.arch }}-v2-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('OLLMchat/sqgipkg.json', 'OLLMchat/scripts/release/sqgi.revision') }}-ubuntu-25.04
          restore-keys: |
            ${{ inputs.refresh_cache && 'sqgipkg-linux-nocache-' || format('sqgipkg-linux-{0}-v2-stable-', matrix.arch) }}
            ${{ inputs.refresh_cache && 'sqgipkg-linux-nocache-' || (matrix.arch == 'x86_64' && 'sqgipkg-linux-v1-stable-' || 'sqgipkg-linux-nocache-') }}

      - name: Install host build dependencies
        working-directory: OLLMchat
        run: |
          chmod +x scripts/ci/enable-roojs-apt.sh
          ./scripts/ci/enable-roojs-apt.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git file ca-certificates wget curl \
            meson valac gobject-introspection lsb-release \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev \
            libgee-0.8-dev libjson-glib-dev libsoup-3.0-dev libgnutls28-dev libxml2-dev \
            libsqlite3-dev libgtk-4-dev libgtksourceview-5-dev libadwaita-1-dev libsecret-1-dev \
            libwebkitgtk-6.0-dev libwebkitgtk-6.0-webdriver-dev libatspi2.0-dev \
            libtree-sitter-dev libseccomp-dev libgit2-glib-1.0-dev libavahi-gobject-dev \
            libopenblas-dev liblapack-dev

      - name: Read sqgi revision
        id: sqgi
        working-directory: OLLMchat
        run: |
          rev="$(grep -v '^[[:space:]]*#' scripts/release/sqgi.revision | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')"
          if [ -z "$rev" ]; then
            echo "Missing sqgi revision in scripts/release/sqgi.revision" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Checkout sqgi (runtime + sqgipkg)
        uses: actions/checkout@v4
        with:
          repository: supercamel/sqgi
          path: sqgi
          ref: ${{ steps.sqgi.outputs.rev }}

      - name: Restore sqgi build cache
        id: sqgi-build
        uses: actions/cache/restore@v6
        with:
          path: sqgi/build
          key: sqgi-build-v1-${{ hashFiles('OLLMchat/scripts/release/sqgi.revision') }}
          restore-keys: sqgi-build-v1-

      - name: Install AppImage build dependencies
        run: |
          extra=""
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            extra="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static binfmt-support"
          fi
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools $extra

      - name: Build and install sqgi
        run: |
          cmake -S sqgi -B sqgi/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=ON
          cmake --build sqgi/build
          sudo cmake --install sqgi/build --prefix /usr/local
          sudo ldconfig

      - name: Save sqgi build cache
        if: success() && steps.sqgi-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: sqgi/build
          key: ${{ steps.sqgi-build.outputs.cache-primary-key }}

      - name: Build Linux ${{ matrix.arch }} AppImage
        working-directory: OLLMchat
        run: |
          refresh=""
          if [ "${{ inputs.refresh_cache }}" = "true" ]; then
            refresh=--refresh-linux-packages
          fi
          sqgipkg --target appimage --appimage-arch "${{ matrix.arch }}" \
            --sqgi-source-dir "$GITHUB_WORKSPACE/sqgi" \
            --linux-deb-sysroot-cache "$GITHUB_WORKSPACE/OLLMchat/.ci-cache/sqgipkg/linux-sysroots" \
            $refresh

      - name: Save sqgipkg Linux sysroot cache
        if: success() && steps.sqgipkg-sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: OLLMchat/.ci-cache/sqgipkg
          key: ${{ steps.sqgipkg-sysroot.outputs.cache-primary-key }}

      - name: Collect artifacts
        working-directory: OLLMchat
        run: |
          mkdir -p artifacts
          cp "dist-linux-${{ matrix.arch }}/OLLMchat.AppImage" \
            "artifacts/OLLMchat-remote-only-${{ matrix.arch }}.AppImage"
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollmchat-appimage-${{ matrix.arch }}
          path: OLLMchat/artifacts/*
