name: X - Windows NSIS installer (Release calls this)

# Native MSYS2 UCRT64 compile + versioned Setup.exe.
# Start Release - Windows, or let Release (release.yml) call this.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # Vala @"…" → C uses "…\n" \ continuations; CRLF makes `\` not last
      # before newline and MinGW fails with missing terminating ". Keep LF in
      # the workflow — do not wrap Meson's CC (Windows rejects shell scripts).
      - name: Git LF only
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5

      - name: Strip CR from Vala sources
        shell: bash
        run: |
          find . \( -name '*.vala' -o -name '*.vapi' \) \
            ! -path './webview2-gtk/*' \
            ! -path './.ci-*/*' \
            ! -path './build/*' \
            ! -path './build-*/*' \
            -print0 | while IFS= read -r -d '' f; do
            sed -i 's/\r$//' "$f"
          done

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: strict
          update: true
          install: >-
            base-devel
            git
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-libgee
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libgit2-glib
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-libtree-sitter
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-lapack
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-cantarell-fonts
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nsis

      - name: Build OLLMchat (FAISS + webview2gtk pacman + meson)
        run: |
          chmod +x scripts/ci/windows-msys2-build.sh
          ./scripts/ci/windows-msys2-build.sh

      - name: Package versioned NSIS installer
        run: |
          chmod +x scripts/ci/windows-package-nsis.sh scripts/copy-exe-runtime-dlls.sh
          ./scripts/ci/windows-package-nsis.sh

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp -v dist-windows/OLLMchat-*-Setup.exe artifacts/
          ls -lh artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollmchat-windows
          path: artifacts/*
