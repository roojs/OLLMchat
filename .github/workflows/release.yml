name: Release

# Full package set. Tag pushes (scripts/release.sh) publish two GitHub
# Releases. vX.Y.Z carries the Windows installer and the Android APKs.
# GitHub adds the source zip and tarball. vX.Y.Z-packages carries
# everything else: .deb, .rpm, .pixie, Windows library archives, AppImage.
# Packages is created first so the Releases page (newest created_at
# first) shows the version tag, then packages, then older versions.
# scripts/release.sh pushes vX.Y.Z-packages to git.roojs.com with the
# version tag. The mirror copies it here. This workflow ignores
# v*-packages, so that push does not start another build. A packages
# tag that exists only on GitHub is deleted on the next mirror sync,
# and GitHub turns the release back into a draft.
# To test one distro, run Release - Debian / Fedora / etc.

run-name: Release - ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
      - '!v*-packages'
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Rebuild sqgipkg and Meson caches from scratch
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Android
    if: ${{ !endsWith(github.ref_name, '-packages') }}
    uses: ./.github/workflows/x-android.yml
    with:
      refresh_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_cache || false }}
      upload_to_release: true
    permissions:
      contents: read

  build-debian:
    name: Debian
    if: ${{ !endsWith(github.ref_name, '-packages') }}
    uses: ./.github/workflows/x-debian.yml
    permissions:
      contents: read

  build-appimage:
    name: AppImage
    if: ${{ !endsWith(github.ref_name, '-packages') }}
    uses: ./.github/workflows/x-sqgipkg.yml
    with:
      refresh_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_cache || false }}
    permissions:
      contents: read

  build-windows:
    name: Windows
    if: ${{ !endsWith(github.ref_name, '-packages') }}
    uses: ./.github/workflows/x-windows.yml
    permissions:
      contents: read

  build-rpm-fedora:
    name: Fedora
    if: ${{ !endsWith(github.ref_name, '-packages') }}
    uses: ./.github/workflows/x-rpm.yml
    with:
      job_name: Fedora 44 RPMs
      distro: fedora
      image: fedora:44
      artifact_name: ollmchat-rpm-fedora
    permissions:
      contents: read

  build-rpm-opensuse:
    name: openSUSE
    if: ${{ !endsWith(github.ref_name, '-packages') }}
    uses: ./.github/workflows/x-rpm.yml
    with:
      job_name: openSUSE Tumbleweed RPMs
      distro: opensuse
      image: opensuse/tumbleweed
      artifact_name: ollmchat-rpm-opensuse
    permissions:
      contents: read

  publish:
    name: Publish
    needs: [build-debian, build-rpm-fedora, build-rpm-opensuse, build-windows, build-android, build-appimage]
    if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref_name, '-packages')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          pattern: ollmchat-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p artifacts/main artifacts/packages
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.exe|*.apk) mv "$f" artifacts/main/ ;;
              *.deb|*.rpm|*.AppImage|*.pixie|*.pkg.tar.zst|*.pkg.tar.zst.sig) mv "$f" artifacts/packages/ ;;
              # Pin lists are published on GitHub Pages. They are not release assets.
              # The path is artifacts/release.pins; a bare release.pins pattern does not match.
              *.pins)
                if [ "$(basename "$f")" = release.pins ]; then
                  mv "$f" artifacts/pixie-release.pins
                else
                  rm -f "$f"
                fi
                ;;
              *)
                echo "unclassified release asset: $f" >&2
                exit 1
                ;;
            esac
          done
          main_files=(artifacts/main/*)
          packages_files=(artifacts/packages/*)
          ls -lh artifacts/main artifacts/packages
          ((${#main_files[@]})) || {
            echo "no Windows installer or Android APK" >&2
            exit 1
          }
          apk_files=(artifacts/main/*.apk)
          ((${#apk_files[@]})) || {
            echo "no Android APK; refusing to publish" >&2
            exit 1
          }
          ((${#packages_files[@]})) || {
            echo "no package assets" >&2
            exit 1
          }
          for arch in x86_64 aarch64; do
            [ -f "artifacts/packages/OLLMchat-remote-only-${arch}.AppImage" ] || {
              echo "missing OLLMchat-remote-only-${arch}.AppImage" >&2
              exit 1
            }
          done
          chmod +x scripts/release/changelog.sh scripts/release/render-release-notes.sh
          ./scripts/release/render-release-notes.sh "$GITHUB_REF_NAME" release-notes.md
          pkg_tag="${GITHUB_REF_NAME}-packages"
          # scripts/release.sh pushes this tag to git.roojs.com with the
          # version tag. The mirror copies it here. Creating it only on
          # GitHub gets it deleted on the next mirror sync, and GitHub
          # turns the release back into a draft.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${pkg_tag}" >/dev/null; then
            echo "missing git tag ${pkg_tag}." >&2
            echo "scripts/release.sh has to push that tag to git.roojs.com with the version tag." >&2
            exit 1
          fi
          # Deleting a tag (scripts/release.sh --retry) turns that release
          # into an untagged draft and leaves it there. Drop those before
          # creating the release again.
          drop_drafts() {
            local tag="$1"
            local id
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              echo "deleting draft release ${id} (${tag})"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.draft == true and .tag_name == \"${tag}\") | .id")
          }
          {
            echo "Distro packages, Android \`.pixie\` files, and Windows library archives for ${GITHUB_REF_NAME}."
            echo
            echo "Prefer the [roojs package repositories](https://roojs.github.io/repos/) (\`apt\` / \`dnf\` / \`zypper\`). This GitHub Release is the matching file set."
            echo
            echo "The Windows installer and the Android APKs: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          } > packages-notes.md
          # Create packages first. GitHub lists Releases by created_at
          # (newest first), so the version tag published next sits above
          # this one: vX.Y.Z, then vX.Y.Z-packages, then older versions.
          drop_drafts "$pkg_tag"
          gh release create "$pkg_tag" "${packages_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${GITHUB_REF_NAME} packages" \
            --notes-file packages-notes.md \
            --latest=false \
          || {
            gh release upload "$pkg_tag" "${packages_files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$pkg_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file packages-notes.md \
              --latest=false \
              --draft=false
          }
          drop_drafts "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "${main_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
          || {
            gh release upload "$GITHUB_REF_NAME" "${main_files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md \
              --draft=false
          }
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest --draft=false

      - name: Finalize changelog on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release/finalize-changelog.sh "$GITHUB_REF_NAME"
          git add CHANGELOG.md debian/changelog
          if [ -f artifacts/pixie-release.pins ]; then
            cp artifacts/pixie-release.pins release.pins
            git add release.pins
          fi
          git diff --staged --quiet && exit 0
          publish_pins=0
          if git diff --staged --name-only -- release.pins | grep -q .; then
            publish_pins=1
          fi
          git commit -m "Finalize changelog for $GITHUB_REF_NAME"
          git push origin HEAD:main
          # The release token's push does not start other workflows.
          # Pages deploys are allowed from main, not from this tag.
          if [ "$publish_pins" = 1 ]; then
            gh workflow run deploy-docs.yml --ref main
          fi
