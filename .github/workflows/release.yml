name: Release

# Full package set. Tag pushes (scripts/release.sh) publish GitHub Release
# assets. To test one distro, run Release - Debian / Fedora / openSUSE / etc.

run-name: Release - ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Rebuild sqgipkg and Meson caches from scratch
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Android
    uses: ./.github/workflows/x-android.yml
    with:
      refresh_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_cache || false }}
      upload_to_release: true
      non_blocking: true
    permissions:
      contents: read

  build-debian:
    name: Debian
    uses: ./.github/workflows/x-debian.yml
    permissions:
      contents: read

  build-appimage:
    name: AppImage
    uses: ./.github/workflows/x-sqgipkg.yml
    with:
      refresh_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_cache || false }}
    permissions:
      contents: read

  build-windows:
    name: Windows
    uses: ./.github/workflows/x-windows.yml
    permissions:
      contents: read

  build-rpm-fedora:
    name: Fedora
    uses: ./.github/workflows/x-rpm.yml
    with:
      job_name: Fedora 44 RPMs
      distro: fedora
      image: fedora:44
      artifact_name: ollmchat-rpm-fedora
    permissions:
      contents: read

  build-rpm-opensuse:
    name: openSUSE
    uses: ./.github/workflows/x-rpm.yml
    with:
      job_name: openSUSE Tumbleweed RPMs
      distro: opensuse
      image: opensuse/tumbleweed
      artifact_name: ollmchat-rpm-opensuse
    permissions:
      contents: read

  publish:
    name: Publish
    needs: [build-appimage, build-debian, build-rpm-fedora, build-rpm-opensuse, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          pattern: ollmchat-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          chmod +x scripts/release/changelog.sh scripts/release/render-release-notes.sh
          ./scripts/release/render-release-notes.sh "$GITHUB_REF_NAME" release-notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
          || {
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
          }

      - name: Finalize changelog on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release/finalize-changelog.sh "$GITHUB_REF_NAME"
          git add CHANGELOG.md debian/changelog
          git diff --staged --quiet && exit 0
          git commit -m "Finalize changelog for $GITHUB_REF_NAME"
          git push origin HEAD:main
