name: X - Meson compile check, remote-only (no packages)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Meson remote-only compile
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:25.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            gobject-introspection \
            libadwaita-1-dev \
            libsecret-1-dev \
            libatspi2.0-dev \
            libblas-dev \
            libcairo2-dev \
            libfaiss-dev \
            libffi-dev \
            libgee-0.8-dev \
            libgirepository1.0-dev \
            libgit2-glib-1.0-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libjson-glib-dev \
            liblapack-dev \
            libomp-dev \
            libopenblas-dev \
            libseccomp-dev \
            libsoup-3.0-dev \
            libsqlite3-dev \
            libtree-sitter-dev \
            libwebkitgtk-6.0-dev \
            libxml2-dev \
            meson \
            ninja-build \
            pkg-config \
            valac

      - name: Configure remote-only build
        run: |
          meson setup build \
            --prefix=/usr \
            -Ddocs=false \
            -Dexamples=true \
            -Dtests=true \
            -Dlocal_gguf=disabled

      - name: Build
        run: ninja -C build

      - name: Build Android shell POC target
        run: |
          meson setup build-android-shell \
            --prefix=/usr \
            -Ddocs=false \
            -Dexamples=false \
            -Dtests=false \
            -Dandroid_shell_poc=true \
            -Dlocal_gguf=disabled
          ninja -C build-android-shell

      - name: Run offline tests
        run: |
          meson test -C build --no-rebuild --print-errorlogs \
            test-ollamaweb-parse \
            test-ollamaweb-merge \
            test-markdown-parser \
            check-back-token-test
