name: Release - Fedora

# Manual Fedora 44 RPM build. Tags still go through Release (release.yml).

on:
  workflow_dispatch:

run-name: Release - Fedora - ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build-rpm-fedora:
    name: Fedora 44 RPMs
    uses: ./.github/workflows/x-rpm.yml
    with:
      job_name: Fedora 44 RPMs
      distro: fedora
      image: fedora:44
      artifact_name: ollmchat-rpm-fedora
