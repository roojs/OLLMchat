name: Release - AppImage

# Manual sqgipkg Linux AppImage build. Tags still go through Release (release.yml).

on:
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Rebuild sqgipkg and Meson caches from scratch
        type: boolean
        default: false

run-name: Release - AppImage - ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build-appimage:
    name: AppImage
    uses: ./.github/workflows/x-sqgipkg.yml
    with:
      refresh_cache: ${{ inputs.refresh_cache }}
