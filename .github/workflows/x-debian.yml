name: X - Debian .deb build (Release calls this)

# The real dpkg-buildpackage job. Start Release - Debian, not this file.
#
# Debian packages is the Ubuntu 26.04 build (plain revision). That is the
# binary questing (25.10) and resolute install. Trixie packages is added
# beside it. A Trixie failure does not drop the Ubuntu artifacts.

on:
  workflow_call:

jobs:
  build-debian:
    name: Debian packages
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    # Container jobs default to sh (dash). Collect artifacts uses shopt;
    # the tag/version check uses [[. Both are bash.
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      ROOJS_APT_SUITE: resolute
      TZ: UTC
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: OLLMchat

      # CI helper (not the user install path — see https://roojs.github.io/repos/).
      - name: Enable roojs APT and install build dependencies
        working-directory: OLLMchat
        run: |
          set -euo pipefail
          chmod +x scripts/ci/enable-roojs-apt.sh
          ./scripts/ci/enable-roojs-apt.sh
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file \
            meson valac gobject-introspection devscripts debhelper \
            libglib2.0-dev libgirepository-2.0-dev libffi-dev libcairo2-dev \
            libgee-0.8-dev libjson-glib-dev libsoup-3.0-dev libgnutls28-dev libxml2-dev \
            libsqlite3-dev libgtk-4-dev libgtksourceview-5-dev libadwaita-1-dev libsecret-1-dev \
            humanity-icon-theme \
            libwebkitgtk-6.0-dev libwebkitgtk-6.0-webdriver-dev libatspi2.0-dev \
            libtree-sitter-dev libseccomp-dev libgit2-glib-1.0-dev libavahi-gobject-dev \
            libopenblas-dev liblapack-dev libfaiss-dev libllama-dev
          pkg-config --atleast-version=2.86 girepository-2.0

      - name: Build Debian packages (amd64)
        working-directory: OLLMchat
        env:
          DEBFULLNAME: GitHub Actions
          DEBEMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail
          chmod +x scripts/release/changelog.sh scripts/release/sync-debian-changelog.sh
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if cl_ver="$(./scripts/release/changelog.sh version 2>/dev/null)"; then
              tag_ver="${GITHUB_REF_NAME#v}"
              if [[ "${cl_ver}" != "${tag_ver}" ]]; then
                echo "CHANGELOG.md version ${cl_ver} != tag ${tag_ver}" >&2
                exit 1
              fi
              ./scripts/release/sync-debian-changelog.sh
            else
              ./scripts/release/sync-debian-changelog.sh --release "$GITHUB_REF_NAME"
            fi
          else
            ./scripts/release/sync-debian-changelog.sh
          fi
          ./debian/use-split-packages.sh
          dpkg-buildpackage -us -uc -b
          rm -rf build
          ./debian/use-monolithic-remote-only-package.sh
          dpkg-buildpackage -us -uc -b
          ./debian/use-split-packages.sh

      - name: Collect artifacts
        working-directory: OLLMchat
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for deb in ../*.deb; do
            case "${deb}" in
              *dbgsym*) continue ;;
            esac
            cp -v "${deb}" artifacts/
          done
          ls -lh artifacts

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollmchat-debian
          path: OLLMchat/artifacts/*

  build-debian-trixie:
    name: Trixie packages
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      ROOJS_APT_SUITE: trixie
      TZ: UTC
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: OLLMchat

      - name: Enable roojs APT and install build dependencies
        working-directory: OLLMchat
        run: |
          set -euo pipefail
          chmod +x scripts/ci/enable-roojs-apt.sh
          ./scripts/ci/enable-roojs-apt.sh
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file \
            meson valac gobject-introspection devscripts debhelper \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev \
            libgee-0.8-dev libjson-glib-dev libsoup-3.0-dev libgnutls28-dev libxml2-dev \
            libsqlite3-dev libgtk-4-dev libgtksourceview-5-dev libadwaita-1-dev libsecret-1-dev \
            hicolor-icon-theme \
            libwebkitgtk-6.0-dev libatspi2.0-dev \
            libtree-sitter-dev libseccomp-dev libgit2-glib-1.0-dev libavahi-gobject-dev \
            libopenblas-dev liblapack-dev libfaiss-dev libllama-dev
          curl -fsSL -o /tmp/humanity-icon-theme.deb \
            http://archive.ubuntu.com/ubuntu/pool/universe/h/humanity-icon-theme/humanity-icon-theme_0.6.16build1_all.deb
          apt-get install -y /tmp/humanity-icon-theme.deb

      - name: Build Debian packages (amd64)
        working-directory: OLLMchat
        env:
          DEBFULLNAME: GitHub Actions
          DEBEMAIL: actions@users.noreply.github.com
          WEBKIT_WEBDRIVER: disabled
        run: |
          set -euo pipefail
          chmod +x scripts/release/changelog.sh scripts/release/sync-debian-changelog.sh
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if cl_ver="$(./scripts/release/changelog.sh version 2>/dev/null)"; then
              tag_ver="${GITHUB_REF_NAME#v}"
              if [[ "${cl_ver}" != "${tag_ver}" ]]; then
                echo "CHANGELOG.md version ${cl_ver} != tag ${tag_ver}" >&2
                exit 1
              fi
              ./scripts/release/sync-debian-changelog.sh
            else
              ./scripts/release/sync-debian-changelog.sh --release "$GITHUB_REF_NAME"
            fi
          else
            ./scripts/release/sync-debian-changelog.sh
          fi
          sed -i '1s/(\([^)]*\))/(\1+trixie)/' debian/changelog
          head -n 1 debian/changelog
          # No WebDriver -dev package on Trixie. Stock WebKit is the link.
          sed -i '/libwebkitgtk-6.0-webdriver-dev/d' \
            debian/control debian/split/control \
            debian/monolithic/control debian/monolithic-remote-only/control
          ./debian/use-split-packages.sh
          dpkg-buildpackage -us -uc -b
          rm -rf build
          ./debian/use-monolithic-remote-only-package.sh
          dpkg-buildpackage -us -uc -b
          ./debian/use-split-packages.sh

      - name: Collect artifacts
        working-directory: OLLMchat
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          found=0
          for deb in ../*.deb; do
            case "${deb}" in
              *dbgsym*) continue ;;
              *+trixie_*) ;;
              *)
                echo "suite label +trixie missing from ${deb}" >&2
                exit 1
                ;;
            esac
            cp -v "${deb}" artifacts/
            found=1
          done
          if [[ "$found" -eq 0 ]]; then
            echo "no .deb files" >&2
            exit 1
          fi
          ls -lh artifacts

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollmchat-debian-trixie
          path: OLLMchat/artifacts/*
