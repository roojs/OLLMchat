name: X - Debian .deb build (Release calls this)

# The real dpkg-buildpackage job. Start Release - Debian, not this file.
#
# One job builds both archives. Ubuntu 26.04 keeps the plain revision.
# Trixie filenames carry +trixie (libocrpc1_1.4.6-1+trixie_amd64.deb).

on:
  workflow_call:

jobs:
  build-debian:
    name: Debian packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ubuntu 26.04 packages
        env:
          DEBFULLNAME: GitHub Actions
          DEBEMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          docker run --rm \
            -v "${parent}:${parent}" \
            -w "$GITHUB_WORKSPACE" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e ROOJS_APT_SUITE=resolute \
            -e OLL_GIR_DEV=libgirepository-2.0-dev \
            -e OLL_GIR_GATE=1 \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e DEBFULLNAME \
            -e DEBEMAIL \
            ubuntu:26.04 \
            bash scripts/ci/build-debian-packages.sh

      - name: Debian 13 Trixie packages
        env:
          DEBFULLNAME: GitHub Actions
          DEBEMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          docker run --rm \
            -v "${parent}:${parent}" \
            -w "$GITHUB_WORKSPACE" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e ROOJS_APT_SUITE=trixie \
            -e OLL_GIR_DEV=libgirepository1.0-dev \
            -e OLL_GIR_GATE=0 \
            -e OLL_VERSION_SUFFIX=+trixie \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e DEBFULLNAME \
            -e DEBEMAIL \
            debian:trixie \
            bash scripts/ci/build-debian-packages.sh

      - name: Collect artifacts
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          mkdir -p artifacts
          shopt -s nullglob
          plain=0
          trixie=0
          for deb in "${parent}"/*.deb; do
            case "${deb}" in
              *dbgsym*) continue ;;
            esac
            cp -v "${deb}" artifacts/
            if [[ "${deb}" == *+trixie_* ]]; then
              trixie=1
            else
              plain=1
            fi
          done
          if [[ "$plain" -ne 1 || "$trixie" -ne 1 ]]; then
            echo "expected plain and +trixie debs, plain=${plain} trixie=${trixie}" >&2
            ls -l "${parent}" || true
            exit 1
          fi
          ls -lh artifacts

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollmchat-debian
          path: artifacts/*
